submission:
  title: "SmartPort AI"

  problem_statement: >
    Port operators need to predict container congestion and make timely
    decisions about berth, crane, and vessel scheduling to avoid delays
    and inefficient port operations.

  solution_summary: >
    SmartPort AI is an AI-powered decision-support platform that predicts
    congestion, explains its causes, recommends operational changes, and
    generates a 72-hour port operations plan.

  key_features:
    - "Container congestion risk prediction"
    - "72-hour congestion forecasting"
    - "Congestion explanation"
    - "Berth and crane optimisation"
    - "72-hour operational planning"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["GitHub", "Vercel"]

  what_we_are_most_proud_of: >
    An end-to-end decision-support workflow that connects congestion
    prediction with operational recommendations and a 72-hour action plan.

  known_limitations: >
    Initial versions use simulated or synthetic port data and some
    optimisation assumptions. Real-world deployment would require
    integration with live port and vessel data.

