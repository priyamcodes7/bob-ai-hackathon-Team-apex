submission:
  title: "SmartPort AI"

  problem_statement: >
    Port operators need to predict container congestion and make timely
    decisions about berth, crane, and vessel scheduling to avoid delays
    and inefficient port operations.

  solution_summary: >
    SmartPort AI is an AI-powered port operations decision-support platform
    that predicts congestion, explains contributing operational factors,
    recommends berth and crane changes, supports what-if scenarios, and
    generates a 72-hour port operations plan.

  key_features:
    - "Container congestion risk prediction"
    - "72-hour congestion forecasting"
    - "Explainable congestion analysis"
    - "Berth optimisation"
    - "Crane optimisation"
    - "Alternative berth routing"
    - "What-if simulation"
    - "72-hour operational planning"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"
    frameworks:
      - "FastAPI"
      - "React"
      - "Vite"
    ibm_technologies:
      - "IBM Bob"
      - "Model Context Protocol (MCP)"
    databases: []
    other:
      - "Scikit-learn"
      - "Pandas"
      - "Joblib"
      - "GitHub"
      - "GitHub Actions"
      - "Vercel"
      - "Render"

  what_we_are_most_proud_of: >
    An end-to-end decision-support workflow that connects congestion
    prediction with explainable operational factors, berth and crane
    recommendations, what-if analysis, and a 72-hour action plan.

  known_limitations: >
    The current prototype uses structured or simulated port operational
    data rather than live port feeds. The 72-hour forecast is scenario-based,
    operational explanations are rule-based, and berth and crane optimisation
    uses decision logic and heuristics. Production deployment would require
    integration with live vessel, berth, crane, and terminal operating data.

